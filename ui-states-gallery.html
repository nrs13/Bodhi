<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bodhi — UI states gallery</title>
  <link rel="stylesheet" href="extension/styles/widget.css" />
  <style>
    :root {
      --g-bg: #E8ECF4;
      --g-ink: #12141A;
    }
    html[data-gallery-scheme="dark"] {
      --g-bg: #0B0D12;
      --g-ink: #F1F3F7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--g-bg);
      color: var(--g-ink);
      padding: 24px;
    }
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .controls { display: flex; gap: 8px; align-items: center; }
    .controls button {
      border: 1px solid rgba(127,127,127,0.35);
      background: transparent;
      color: inherit;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .controls button.active { background: #9A6B4F; border-color: #9A6B4F; color: #fff; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
    }
    .card { display: flex; flex-direction: column; gap: 10px; }
    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.65;
    }
    .stage {
      position: relative;
      min-height: 220px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, rgba(154,107,79,0.14), transparent 42%),
        repeating-linear-gradient(0deg, transparent, transparent 11px, rgba(127,127,127,0.08) 12px);
      padding: 20px;
      overflow: hidden;
    }
    .bodhi-widget {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      z-index: 1 !important;
    }
  </style>
</head>
<body>
  <header>
    <h1>bodhi states</h1>
    <div class="controls">
      <button type="button" data-scheme="light" class="active">light</button>
      <button type="button" data-scheme="dark">dark</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>

  <script>
    const toolbar = (opts = {}) => `
      <div class="bodhi-toolbar">
        <div class="bodhi-toolbar-left">
          ${opts.back ? `<button class="bodhi-back" aria-label="Back">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><polyline points="15,6 9,12 15,18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 2.5"/></svg>
          </button>` : ''}
        </div>
        ${opts.title
          ? `<div class="bodhi-toolbar-title">${opts.title}</div>`
          : `<div class="bodhi-toolbar-spacer"></div>`}
        <div class="bodhi-toolbar-actions">
          ${opts.history ? `<button class="bodhi-history-btn" aria-label="History">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 3" fill="none"/>
              <polyline points="12,8 12,12.5 15,14.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.5 2.2"/>
            </svg>
          </button>` : ''}
          <button class="bodhi-close" aria-label="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>`

    const caption = `<span class="bodhi-method" title="Found via captions">
      <svg class="bodhi-method-caption" width="13" height="11" viewBox="0 0 16 13" fill="none"><rect x="1" y="1" width="14" height="11" rx="2.5" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.5 2.4" fill="none"/><line x1="5.5" y1="6.5" x2="10.5" y2="6.5" stroke="currentColor" stroke-width="1" stroke-dasharray="1 1.8"/><line x1="8" y1="4" x2="8" y2="9" stroke="currentColor" stroke-width="1" stroke-dasharray="1 1.8"/></svg>
    </span>`
    const search = `<span class="bodhi-method" title="Found via search">
      <svg class="bodhi-method-search" width="12" height="12" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.5 2.4" fill="none"/><line x1="9.3" y1="9.3" x2="12.8" y2="12.8" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.2 2"/></svg>
    </span>`

    const dots = (n, o) => `<div class="bodhi-skeleton-row">${Array.from({length:n},(_,i)=>`<div class="bodhi-skeleton-dot" style="animation-delay:${(o*4+i)*0.07}s"></div>`).join('')}</div>`

    const states = [
      {
        label: 'Success — caption hotkey',
        html: `${toolbar({ history: true })}
          <div class="bodhi-word-row"><div class="bodhi-word">ephemeral</div>${caption}</div>
          <div class="bodhi-pos">adjective</div>
          <div class="bodhi-definition">Lasting for a very short time.</div>
          <div class="bodhi-feedback">
            <div class="bodhi-divider" role="separator"></div>
            <div class="bodhi-action-row">
              <button class="bodhi-thumb" aria-label="Next word">
                <svg class="bodhi-next-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M 21 12 A 9 9 0 1 1 17 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2.8" fill="none"/>
                  <polyline points="14,2 17.2,4.6 14.8,7.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1.6 2.4" fill="none"/>
                </svg>
              </button>
            </div>
          </div>`
      },
      {
        label: 'Success — manual search',
        html: `${toolbar({ history: true })}
          <div class="bodhi-word-row"><div class="bodhi-word">lucid</div>${search}</div>
          <div class="bodhi-pos">adjective</div>
          <div class="bodhi-definition">Expressed clearly; easy to understand.</div>
          <div class="bodhi-footer-link"><button class="bodhi-search-link">search another →</button></div>`
      },
      {
        label: 'Loading',
        html: `${toolbar()}
          <div class="bodhi-skeleton">${dots(10,0)}${dots(5,1)}${dots(14,2)}${dots(11,3)}${dots(8,4)}</div>`
      },
      {
        label: 'Unavailable',
        html: `${toolbar({ history: true })}
          <div class="bodhi-unavailable">
            <p class="bodhi-unavailable-title">no captions nearby</p>
            <p class="bodhi-unavailable-body">Try again in a moment, or search a word yourself.</p>
            <div class="bodhi-unavail-actions"><button class="bodhi-search-link">search a word →</button></div>
          </div>`
      },
      {
        label: 'Search',
        html: `${toolbar({ history: true })}
          <p class="bodhi-search-hint">still curious? <span class="bodhi-search-hint-em">search it.</span></p>
          <div class="bodhi-search-wrap">
            <div class="bodhi-search-row">
              <input class="bodhi-search-input" placeholder="type a word..." />
              <button class="bodhi-search-btn" aria-label="Search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.4" stroke-dasharray="1.8 2.8" fill="none"/><line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="1.4"/></svg>
              </button>
            </div>
          </div>`
      },
      {
        label: 'History (inline expand)',
        html: `${toolbar({ back: true, title: 'session history' })}
          <div class="bodhi-divider" role="separator"></div>
          <div class="bodhi-history-list">
            <div class="bodhi-history-row is-current is-expanded">
              <button type="button" class="bodhi-history-entry is-current" aria-expanded="true">
                <span class="bodhi-history-entry-main">${caption}<span class="bodhi-history-word is-current">ephemeral</span></span>
                <span class="bodhi-history-entry-meta"><span class="bodhi-history-pos">adj</span>
                  <svg class="bodhi-history-chevron open" width="10" height="10" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </button>
              <div class="bodhi-history-def"><p>Lasting for a very short time.</p></div>
            </div>
            <div class="bodhi-history-row">
              <button type="button" class="bodhi-history-entry" aria-expanded="false">
                <span class="bodhi-history-entry-main">${search}<span class="bodhi-history-word">lucid</span></span>
                <span class="bodhi-history-entry-meta"><span class="bodhi-history-pos">adj</span>
                  <svg class="bodhi-history-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </button>
              <div class="bodhi-history-def"><p>Expressed clearly; easy to understand.</p></div>
            </div>
            <div class="bodhi-history-row">
              <button type="button" class="bodhi-history-entry is-kb-focus" aria-expanded="false">
                <span class="bodhi-history-entry-main">${caption}<span class="bodhi-history-word">transient</span></span>
                <span class="bodhi-history-entry-meta"><span class="bodhi-history-pos">adj</span>
                  <svg class="bodhi-history-chevron" width="10" height="10" viewBox="0 0 24 24" fill="none"><polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </button>
              <div class="bodhi-history-def"><p>Passing with time; not permanent.</p></div>
            </div>
          </div>`
      },
      {
        label: 'Dragging (opacity)',
        className: 'bodhi-widget-dragging',
        html: `${toolbar({ history: true })}
          <div class="bodhi-word-row"><div class="bodhi-word">transient</div>${caption}</div>
          <div class="bodhi-definition">Passing with time; not permanent.</div>`
      },
    ]

    const grid = document.getElementById('grid')
    function render(theme) {
      document.documentElement.setAttribute('data-gallery-scheme', theme)
      grid.innerHTML = states.map((s) => `
        <div class="card">
          <div class="label">${s.label} · ${theme}</div>
          <div class="stage">
            <div class="bodhi-widget ${s.className || ''}" data-bodhi-theme="${theme}">
              ${s.html}
            </div>
          </div>
        </div>
      `).join('')
    }

    let theme = 'light'
    render(theme)
    document.querySelectorAll('[data-scheme]').forEach((btn) => {
      btn.addEventListener('click', () => {
        theme = btn.dataset.scheme
        document.querySelectorAll('[data-scheme]').forEach((b) => b.classList.toggle('active', b === btn))
        render(theme)
      })
    })
  </script>
</body>
</html>
